name: Build & Publish Patched Jars

on:
  # Запускается при новом релизе NanoCore
  release:
    types: [published]
  # Или вручную через кнопку Actions → Run workflow
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Пересобрать даже если ядро не изменилось'
        default: 'false'

jobs:
  build-nanocore:
    name: Сборка NanoCore.jar
    runs-on: ubuntu-latest
    outputs:
      jar_path: ${{ steps.build.outputs.jar_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Сборка NanoCore.jar
        id: build
        run: |
          mkdir -p out
          find src -name "*.java" | xargs javac -d out
          echo "Main-Class: com.nanocore.NanoCoreMain" > manifest.txt
          jar cfm NanoCore.jar manifest.txt -C out .
          echo "jar_path=NanoCore.jar" >> $GITHUB_OUTPUT

      - name: Upload NanoCore.jar
        uses: actions/upload-artifact@v4
        with:
          name: NanoCore
          path: NanoCore.jar

  patch-velocity:
    name: Патч Velocity
    runs-on: ubuntu-latest
    needs: build-nanocore

    steps:
      - uses: actions/download-artifact@v4
        with: { name: NanoCore }

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Скачать + Патчить Velocity
        run: java -jar NanoCore.jar --basedir . download velocity

      - name: Upload patched Velocity
        uses: actions/upload-artifact@v4
        with:
          name: velocity-patched
          path: proxy/velocity-patched.jar

  patch-paper:
    name: Патч Paper ${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: build-nanocore
    strategy:
      matrix:
        version: ['1.21.4', '1.21.11']

    steps:
      - uses: actions/download-artifact@v4
        with: { name: NanoCore }

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Скачать + Патчить Paper ${{ matrix.version }}
        run: java -jar NanoCore.jar --basedir . download paper-${{ matrix.version }}

      - name: Upload patched Paper
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.version }}-patched
          path: servers/paper-${{ matrix.version }}/paper-${{ matrix.version }}-patched.jar

  patch-bungee:
    name: Патч BungeeCord
    runs-on: ubuntu-latest
    needs: build-nanocore

    steps:
      - uses: actions/download-artifact@v4
        with: { name: NanoCore }

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Скачать + Патчить BungeeCord
        run: java -jar NanoCore.jar --basedir . download bungee

      - name: Upload patched BungeeCord
        uses: actions/upload-artifact@v4
        with:
          name: BungeeCord-patched
          path: servers/bungee-legacy/BungeeCord-patched.jar

  publish-release:
    name: Публикация в GitHub Releases
    runs-on: ubuntu-latest
    needs: [build-nanocore, patch-velocity, patch-paper, patch-bungee]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with: { name: NanoCore,               path: artifacts/ }
      - uses: actions/download-artifact@v4
        with: { name: velocity-patched,        path: artifacts/ }
      - uses: actions/download-artifact@v4
        with: { name: paper-1.21.4-patched,    path: artifacts/ }
      - uses: actions/download-artifact@v4
        with: { name: paper-1.21.11-patched,   path: artifacts/ }
      - uses: actions/download-artifact@v4
        with: { name: BungeeCord-patched,      path: artifacts/ }

      - name: Публикуем артефакты в релизе
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          body: |
            ## NanoCore Release

            Патченные ядра — скачиваются автоматически при `java -jar NanoCore.jar download`.

            | Файл | Описание |
            |---|---|
            | `NanoCore.jar` | Менеджер ядер |
            | `velocity-patched.jar` | Velocity (bStats, legacy, GS4 удалены) |
            | `paper-1.21.4-patched.jar` | Paper 1.21.4 (bStats, RCON, legacy удалены) |
            | `paper-1.21.11-patched.jar` | Paper 1.21.11 (bStats, RCON, legacy удалены) |
            | `BungeeCord-patched.jar` | BungeeCord (bStats, legacy удалены) |

            ### Что убрано
            - **bStats** — телеметрия, исходящие соединения, лишние потоки
            - **Legacy protocols** — поддержка клиентов MC <1.7 (2013 год)
            - **GS4 Query** — устаревший game-query протокол
            - **RCON** — TCP-сервер удалённого управления (если не используется)
            - **Deprecated API** — обёртки для плагинов 2012 года

            Подробнее: [NanoDev1488/NanoCore](https://github.com/NanoDev1488/NanoCore)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

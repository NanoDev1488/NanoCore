name: Build & Release NanoCore

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'patch / minor / major'
        default: 'patch'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Determine version tag
        id: ver
        run: |
          SRC_VER=$(grep -oP '(?<=VERSION = ")[^"]+' src/com/nanocore/NanoCoreMain.java)
          LAST=$(git tag --sort=-version:refname | head -1)
          if [ -z "$LAST" ]; then NEW="v${SRC_VER}"
          else
            TV=${LAST#v}; MAJ=$(echo $TV|cut -d. -f1); MIN=$(echo $TV|cut -d. -f2); PAT=$(echo $TV|cut -d. -f3)
            BUMP="${{ github.event.inputs.version_bump || 'patch' }}"
            case $BUMP in major) MAJ=$((MAJ+1));MIN=0;PAT=0;; minor) MIN=$((MIN+1));PAT=0;; *) PAT=$((PAT+1));; esac
            NEW="v${MAJ}.${MIN}.${PAT}"
          fi
          echo "tag=$NEW" >> $GITHUB_OUTPUT
          echo "New tag: $NEW"

      - name: Build NanoCore.jar
        run: |
          mkdir -p out
          find src -name "*.java" | xargs javac -d out
          echo "Main-Class: com.nanocore.NanoCoreMain" > manifest.txt
          jar cfm NanoCore.jar manifest.txt -C out .
          echo "NanoCore.jar: $(du -sh NanoCore.jar | cut -f1)"

      - name: Build AdminHub plugins
        run: |
          # Velocity plugin
          mkdir -p velocity_out
          find adminhub/velocity -name "*.java" | xargs javac -proc:none -cp devkit/velocity-api.jar -d velocity_out
          mkdir -p velocity_out/META-INF/velocity
          cp adminhub/velocity-plugin.json velocity_out/META-INF/velocity/velocity-plugin.json
          jar cf NanoCore-AdminHub-Velocity.jar -C velocity_out .
          echo "AdminHub-Velocity: $(du -sh NanoCore-AdminHub-Velocity.jar | cut -f1)"

          # Paper plugin (requires paper-api)
          mkdir -p paper_out
          # paper-api downloaded separately via Maven or from release assets
          if [ -f devkit/paper-api-1.21.4.jar ]; then
            find adminhub/paper -name "*.java" | xargs javac -proc:none -cp devkit/paper-api-1.21.4.jar -d paper_out
            cp adminhub/paper/resources/plugin.yml paper_out/
            jar cf NanoCore-AdminHub-Paper.jar -C paper_out .
            echo "AdminHub-Paper: $(du -sh NanoCore-AdminHub-Paper.jar | cut -f1)"
          fi

      - name: Download & patch server jars
        run: |
          java -jar NanoCore.jar download
          find NanoCore -type f -name "*.jar" | sort

      - name: Create bundle
        run: |
          java -jar NanoCore.jar bundle
          echo "Bundle: $(du -sh NanoCore-bundle.jar 2>/dev/null || echo 'skipped')"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "NanoCore ${{ steps.ver.outputs.tag }}"
          make_latest: true
          body: |
            ## NanoCore ${{ steps.ver.outputs.tag }}

            ### Быстрый старт
            ```bash
            java -jar NanoCore.jar          # авто-скачка при первом запуске
            java -jar NanoCore-bundle.jar   # всё в одном файле
            ```

            ### Pterodactyl
            Startup command: `java -jar {{SERVER_JARFILE}}`
            (любые лишние аргументы автоматически игнорируются)

            ### AdminHub
            Настройка: `NanoCore/nanocore.properties` → `adminhub_enabled=true/false`
          files: |
            NanoCore.jar
            NanoCore-bundle.jar
            NanoCore-AdminHub-Velocity.jar
            NanoCore-AdminHub-Paper.jar
            NanoCore/proxy/velocity-patched.jar
            NanoCore/servers/paper-1.21.4/paper-1.21.4-nanocore.jar
            NanoCore/servers/paper-1.21.11/paper-1.21.11-nanocore.jar
            NanoCore/servers/bungee-legacy/BungeeCord-patched.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Release NanoCore

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump: patch / minor / major'
        required: false
        default: 'patch'

jobs:
  build-and-release:
    name: Build + Patch + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Determine version & tag
        id: version
        run: |
          SRC_VER=$(grep -oP '(?<=VERSION = ")[^"]+' src/com/nanocore/NanoCoreMain.java)
          LAST_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v${SRC_VER}"
          else
            TAG_VER=${LAST_TAG#v}
            MAJOR=$(echo $TAG_VER | cut -d. -f1)
            MINOR=$(echo $TAG_VER | cut -d. -f2)
            PATCH=$(echo $TAG_VER | cut -d. -f3)
            BUMP="${{ github.event.inputs.version_bump || 'patch' }}"
            case $BUMP in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              *)     PATCH=$((PATCH+1)) ;;
            esac
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version=${NEW_TAG#v}" >> $GITHUB_OUTPUT
          echo "New tag: $NEW_TAG"

      - name: Compile NanoCore.jar
        run: |
          mkdir -p out
          find src -name "*.java" | xargs javac -d out
          echo "Main-Class: com.nanocore.NanoCoreMain" > manifest.txt
          jar cfm NanoCore.jar manifest.txt -C out .
          echo "NanoCore.jar: $(du -sh NanoCore.jar | cut -f1)"

      - name: Download & patch server jars
        run: |
          java -jar NanoCore.jar download
          find NanoCore -type f -name "*.jar" | sort

      - name: Create bundle jar
        run: |
          java -jar NanoCore.jar bundle
          echo "Bundle: $(du -sh NanoCore-bundle.jar | cut -f1)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NanoCore ${{ steps.version.outputs.tag }}"
          make_latest: true
          body: |
            ## NanoCore ${{ steps.version.outputs.tag }}

            ### Быстрый старт
            ```bash
            # Маленький jar — качает ядра сам при первом запуске (~44KB)
            java -jar NanoCore.jar

            # Bundle — всё в одном, интернет не нужен (~200MB)
            java -jar NanoCore-bundle.jar
            ```

            ### Файлы
            | Файл | Описание |
            |------|----------|
            | `NanoCore.jar` | Менеджер (~44KB), авто-скачивает ядра |
            | `NanoCore-bundle.jar` | Всё в одном — Velocity + Paper + BungeeCord |
            | `velocity-patched.jar` | Velocity (bStats/legacy/GS4 удалены) |
            | `paper-*-nanocore.jar` | Paper с NanoCore-конфигом |
            | `BungeeCord-patched.jar` | BungeeCord (bStats/legacy удалены) |

            https://github.com/NanoDev1488/NanoCore
          files: |
            NanoCore.jar
            NanoCore-bundle.jar
            NanoCore/proxy/velocity-patched.jar
            NanoCore/servers/paper-1.21.4/paper-1.21.4-nanocore.jar
            NanoCore/servers/paper-1.21.11/paper-1.21.11-nanocore.jar
            NanoCore/servers/bungee-legacy/BungeeCord-patched.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          

name: Build & Publish Patched Jars

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-patch:
    name: Build + Download + Patch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Compile NanoCore.jar
        run: |
          mkdir -p out
          find src -name "*.java" | xargs javac -d out
          echo "Main-Class: com.nanocore.NanoCoreMain" > manifest.txt
          jar cfm NanoCore.jar manifest.txt -C out .
          echo "Built: $(du -sh NanoCore.jar | cut -f1)"

      - name: Download & patch all server jars
        run: |
          java -jar NanoCore.jar download
          echo "=== Files ==="
          find NanoCore -type f -name "*.jar" | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanocore-patched-jars
          if-no-files-found: warn
          path: |
            NanoCore.jar
            NanoCore/proxy/velocity-patched.jar
            NanoCore/servers/paper-1.21.4/paper-1.21.4-nanocore.jar
            NanoCore/servers/paper-1.21.11/paper-1.21.11-nanocore.jar
            NanoCore/servers/bungee-legacy/BungeeCord-patched.jar

      - name: Publish to GitHub Releases
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NanoCore.jar
            NanoCore/proxy/velocity-patched.jar
            NanoCore/servers/paper-1.21.4/paper-1.21.4-nanocore.jar
            NanoCore/servers/paper-1.21.11/paper-1.21.11-nanocore.jar
            NanoCore/servers/bungee-legacy/BungeeCord-patched.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
